<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lung Cancer Detection</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
  <style>
    body {
     /* background-image: url("https://jnj-content-lab2.brightspotcdn.com/dims4/default/78c6313/2147483647/strip/false/crop/1440x666+0+0/resize/1440x666!/quality/90/?url=https%3A%2F%2Fjnj-production-jnj.s3.us-east-1.amazonaws.com%2Fbrightspot%2F1b%2F32%2F2e138abbf1792e49103c9e3516a8%2Fno-one-would-believe-me-when-i-suspected-i-had-lung-cancer-0923-new.jpg");  */
      background-size: cover;
      background-repeat: no-repeat;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    .navbar-brand img {
      height: 30px;
      margin-right: 8px;
    }

    .upload-card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      margin: 90px auto 50px auto;
    }

    #preview {
      max-height: 250px;
      object-fit: cover;
      display: none;
      margin-top: 10px;
      border-radius: 10px;
    }

    .btn-primary {
      background-color: #007bff;
      border: none;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    #uploadSection {
      margin-top: 200px;
      /* background-color: seagreen; */
    }

  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <span class="fw-bold text-primary">LungCancer</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav me-3">
          <li class="nav-item">
            <a class="nav-link active text-primary fw-semibold" href="{{ url_for('index') }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-primary fw-semibold" href="{{ url_for('about') }}">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-primary fw-semibold" href="{{ url_for('contact') }}">Contact</a>
          </li>
          <li class="nav-item">
          <a class="nav-link text-primary fw-semibold" href="{{ url_for('history') }}">History</a>
        </li>
          <li class="nav-item">
            <a class="nav-link text-primary fw-semibold" href="{{ url_for('logout') }}">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Upload Section -->
  <div id="uploadSection" class="upload-card" data-aos="zoom-in">
    <h2 class="text-center text-primary mb-4">Upload CT Scan</h2>
    <form id="uploadForm" method="POST" enctype="multipart/form-data" action="/" novalidate>
      <div class="mb-3">
        <label for="ctImage" class="form-label">Select CT Scan Image</label>
        <input class="form-control" type="file" id="ctImage" name="ctImage" accept="image/*" required />
        <div class="invalid-feedback">Please upload a valid image under 2MB.</div>
        <img id="preview" class="img-fluid mt-2" alt="Image Preview"/>
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit for Analysis</button>
    </form>
  </div>
  <footer></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();

    const fileInput = document.getElementById('ctImage');
    const preview = document.getElementById('preview');

    fileInput.addEventListener('change', function () {
      const file = this.files[0];
      const maxSize = 2 * 1024 * 1024;

      if (file && file.size <= maxSize) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        fileInput.setCustomValidity('');
      } else {
        preview.style.display = 'none';
        fileInput.setCustomValidity("File too large or invalid.");
      }
    });
  </script>
</body>
</html>
