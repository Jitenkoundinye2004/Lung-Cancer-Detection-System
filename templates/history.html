<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History - Lung Cancer Detection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
        }

        .navbar-brand img {
            height: 30px;
            margin-right: 8px;
        }

        .history-section {
            padding-top: 120px;
            padding-bottom: 60px;
        }

        .history-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: transform 0.2s ease-in-out;
        }

        .history-card:hover {
            transform: scale(1.02);
        }

        .history-img {
            height: 200px;
            object-fit: cover;
            width: 100%;
        }

        .card-body {
            padding: 20px;
        }

        .result-badge {
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <span class="fw-bold text-primary">LungCancer</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav me-3">
                    <li class="nav-item">
                        <a class="nav-link text-primary fw-semibold" href="{{ url_for('index') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-primary fw-semibold" href="{{ url_for('about') }}">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-primary fw-semibold" href="{{ url_for('contact') }}">Contact</a>
                    </li>
                     <li class="nav-item">
          <a class="nav-link text-primary fw-semibold" href="{{ url_for('history') }}">History</a>
        </li> 
                    <li class="nav-item">
                        <a class="nav-link text-primary fw-semibold" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- History Section -->
    <div class="container history-section">
        <h2 class="text-center text-primary mb-5">Scan History</h2>
        <div class="row g-4">


            {% for item in history %}
<div class="col-md-6 col-lg-4" data-aos="fade-up">
    <div class="history-card">
        <img src="{{ url_for('static', filename='uploads/' + item.filename) }}" class="history-img" alt="CT Scan Image">
        <div class="card-body">
            <h5 class="card-title text-primary">Result: <span class="badge bg-info text-dark result-badge">{{ item.result }}</span></h5>
            <p class="card-text"><strong>Date:</strong> {{ item.date }}</p>
            <p class="card-text"><strong>Uploaded by:</strong> {{ item.user }}</p>
            <a href="{{ url_for('static', filename='uploads/' + item.filename) }}" class="btn btn-outline-primary btn-sm mt-2" target="_blank">View Image</a>
            <form method="POST" action="{{ url_for('delete_history', prediction_id=item.id) }}" style="display:inline;">
                <button type="submit" class="btn btn-danger btn-sm mt-2" onclick="return confirm('Are you sure you want to delete this prediction?');">
                    Delete
                </button>
            </form>
        </div>
    </div>
</div>
{% else %}
<div class="text-center text-muted">No scan history available.</div>
{% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>

</html>
