<!-- templates/result.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prediction Result</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
  <style>
    body {
      /* background-image: url("https://emag.medicalexpo.com/wp-content/uploads/sites/9/AI_Lung_Cancer_AdobeStock.jpg"); */
      background-size: cover;
      background-repeat: no-repeat;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar-brand img {
      height: 30px;
      margin-right: 8px;
    }
    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .card-header {
      background-color: #007bff;
      color: white;
      font-weight: 500;
      border-radius: 15px 15px 0 0;
    }
    .prediction-text {
      font-size: 1.4rem;
      padding: 20px;
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 10px;
      color: #856404;
      max-width: 600px;
      margin: 40px auto 0 auto;
      text-align: center;
    }
    .accuracy-text {
      font-size: 1.2rem;
      padding: 15px;
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      border-radius: 10px;
      color: #155724;
      max-width: 600px;
      margin: 20px auto;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="" alt="">
        <span class="fw-bold text-primary">LungCancer</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav me-3">
          <li class="nav-item">
            <a class="nav-link active text-primary fw-semibold" href="{{ url_for('index') }}
            ">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-primary fw-semibold" href="{{ url_for('about') }}">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-primary fw-semibold" href="{{ url_for('contact') }}">Contact</a>
          </li>
          <li class="nav-item">
          <a class="nav-link text-primary fw-semibold" href="{{ url_for('history') }}">History</a>
        </li>
         <li class="nav-item">
            <a class="nav-link text-primary fw-semibold" href="{{ url_for('logout') }}">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="text-center text-primary mb-5" style="margin-top: 40px;">Prediction Result</h2>

    <div class="row text-center g-4">
      <div class="col-md-4">
        <div class="card" data-aos="zoom-in" data-aos-delay="100">
          <div class="card-header">Original Image</div>
          <img src="{{ url_for('static', filename='uploads/' + original) }}" class="card-img-top" alt="Original Image">
        </div>
      </div>
      <div class="col-md-4">
        <div class="card" data-aos="zoom-in" data-aos-delay="200">
          <div class="card-header">Filtered Image</div>
          <img src="{{ url_for('static', filename='uploads/' + filtered) }}" class="card-img-top" alt="Filtered Image">
        </div>
      </div>
      <div class="col-md-4">
        <div class="card" data-aos="zoom-in" data-aos-delay="300">
          <div class="card-header">Segmented Image</div>
          <img src="{{ url_for('static', filename='uploads/' + segmented) }}" class="card-img-top" alt="Segmented Image">
        </div>
      </div>
    </div>

    <div class="prediction-text" data-aos="fade-up" data-aos-delay="400">
      <strong>Prediction: </strong> <span class="text-danger fw-bold">{{ prediction }}</span>
    </div>

    <div class="accuracy-text" data-aos="fade-up" data-aos-delay="500">
      <strong>Prediction confidence: </strong> <span class="fw-bold">{{ accuracy }}%</span>
    </div>

    <div class="text-center" data-aos="fade-up" data-aos-delay="600">
      <a href="{{ url_for('index') }}" class="btn btn-sm btn-outline-primary mt-3">Upload Another</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</body>
</html>
